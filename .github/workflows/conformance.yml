name: Conformance

# Checks the Python, JavaScript and C++ data layers against the shared 100-bit packet
# vectors in tests/vectors. Rust runs the same vectors as part of `cargo test` in rust-ci.yml.
# No models, GPUs or secrets are needed.

on:
  push:
    branches: [main]
    paths:
      - 'tests/vectors/**'
      - 'python/trustmark/bchecc.py'
      - 'python/trustmark/datalayer.py'
      - 'python/tests/test_conformance_vectors.py'
      - 'js/**'
      - 'cpp/src/bch.*'
      - 'cpp/tests/**'
      - 'cpp/CMakeLists.txt'
      - '.github/workflows/conformance.yml'
  pull_request:
    paths:
      - 'tests/vectors/**'
      - 'python/trustmark/bchecc.py'
      - 'python/trustmark/datalayer.py'
      - 'python/tests/test_conformance_vectors.py'
      - 'js/**'
      - 'cpp/src/bch.*'
      - 'cpp/tests/**'
      - 'cpp/CMakeLists.txt'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The data layer only needs numpy; the tests load it without the trustmark package,
      # so torch is not installed.
      - name: Install numpy and pytest
        run: python -m pip install numpy pytest

      - name: Check the vector files are up to date
        run: python tests/vectors/generate.py --check

      - name: Test
        run: python -m pytest python/tests/test_conformance_vectors.py

  js:
    name: JavaScript data layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: node --test js/tests/*.test.mjs

  cpp:
    name: C++ BCH
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only cpp/src/bch.cpp is needed, so build with g++ directly instead of CMake, which
      # requires ONNX Runtime and OpenCV for the runner.
      - name: Build
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 -UNDEBUG -Icpp/src cpp/tests/bch.cpp cpp/src/bch.cpp -o "$RUNNER_TEMP/bch-test"
          g++ -std=c++17 -Wall -Wextra -Werror -O2 -Icpp/src cpp/tests/conformance.cpp cpp/src/bch.cpp -o "$RUNNER_TEMP/conformance-test"

      - name: Test
        run: |
          "$RUNNER_TEMP/bch-test"
          "$RUNNER_TEMP/conformance-test" tests/vectors/packets.tsv
