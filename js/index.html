<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TrustMark JS / Client-side Decode Demonstrator</title>
  <script src="deps/ort.webgpu.min.js"></script>
  <script src="deps/bch_ecc.min.js"></script>
  <script src="tm_datalayer.js"></script>
  <script src="tm_core.js"></script>
  <script>
    // The decoders to load can be chosen with a query parameter, e.g. index.html?decoders=Q,P,B,C
    // (default Q,P; each decoder is a 22-47 MB download)
    var TRUSTMARK_AUTO_INIT = false;
  </script>
  <script src="tm_watermark.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    body {
      background-color: #f2f2f2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    .upload-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Drop Zone styling */
    #drop-zone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      width: 100%;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s ease;
      cursor: pointer;
      text-align: center;
      margin-bottom: 20px;
      color: #999;
      padding: 20px;
    }
    #drop-zone.hover {
      border-color: #999;
      color: #666;
    }
    #drop-zone p {
      margin-bottom: 10px;
      font-size: 18px;
      color: #666;
    }

    .browse-btn {
      background: #007aff;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }
    .browse-btn:hover {
      background: #005bb5;
    }

    /* Preview & Decoder Output */
    .preview-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 20px;
      width: 100%;
      align-items: center;
    }
    #preview-image {
      max-width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      object-fit: contain;
    }
    #decoder-output {
      width: 100%;
      min-height: 200px;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      white-space: pre-wrap;
      overflow-y: auto;
      font-family: monospace;
      background-color: #fafafa;
    }
    #decoder-output.error {
      border-color: #d93025;
      color: #a50e0e;
    }

    #model-status {
      width: 100%;
      max-width: 600px;
      margin: 0 auto 20px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 13px;
      color: #555;
    }
    #model-status.error {
      color: #a50e0e;
    }

    /* Watermark embedding */
    h2 {
      margin: 30px 0 15px;
      color: #333;
    }
    .encode-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .encode-options {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    #encode-payload {
      width: 100%;
      font-family: monospace;
      padding: 6px;
    }
    #encode-output {
      white-space: pre-wrap;
      font-family: monospace;
    }
    #encode-output.error {
      color: #a50e0e;
    }
    #encode-preview {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <h1>TrustMark JS / Client-side Decode Demonstrator</h1>
  <div id="model-status">Loading watermark models...</div>
  <div class="upload-container">
    <div id="drop-zone">
      <p>Drag &amp; drop your image here</p>
      <p>— or —</p>
      <button class="browse-btn" id="browse-btn">Browse Files</button>
    </div>
  
    <!-- Hidden input to handle file selection -->
    <input type="file" id="file-input" accept="image/*" style="display: none;">
  
    <!-- Preview & Decoder Output -->
    <div class="preview-container" style="display: none;">
      <img id="preview-image" src="" alt="Preview">
      <div id="decoder-output">Watermark output will appear here...</div>
    </div>
  </div>

  <h2>Embed a watermark</h2>
  <div class="upload-container">
    <div class="encode-form">
      <input type="file" id="encode-file" accept="image/*">
      <div class="encode-options">
        <label>Variant
          <select id="encode-variant">
            <option value="Q" selected>Q (balanced)</option>
            <option value="P">P (highest quality)</option>
            <option value="B">B (paper model)</option>
            <option value="C">C (compact)</option>
          </select>
        </label>
        <label>Schema
          <select id="encode-schema">
            <option value="BCH_SUPER">BCH_SUPER (40 bits)</option>
            <option value="BCH_5" selected>BCH_5 (61 bits)</option>
            <option value="BCH_4">BCH_4 (68 bits)</option>
            <option value="BCH_3">BCH_3 (75 bits)</option>
          </select>
        </label>
      </div>
      <label for="encode-payload" id="encode-payload-label">Payload</label>
      <input type="text" id="encode-payload" spellcheck="false">
      <button class="browse-btn" id="encode-btn">Embed watermark</button>
      <div id="encode-output"></div>
      <a id="encode-download" style="display: none;">Download watermarked PNG</a>
      <img id="encode-preview" alt="Watermarked image" style="display: none;">
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const browseBtn = document.getElementById('browse-btn');
    const previewContainer = document.querySelector('.preview-container');
    const previewImage = document.getElementById('preview-image');
    const decoderOutput = document.getElementById('decoder-output');
    const modelStatus = document.getElementById('model-status');

    // Load the decoders listed in ?decoders=..., or the default ones
    const decodersParam = new URLSearchParams(location.search).get('decoders');
    let initError = '';
    try {
      trustmarkInit(decodersParam === null ? {} : { decoders: decodersParam.split(',').map((v) => v.trim().toUpperCase()).filter(Boolean) });
    } catch (error) {
      initError = `Error in ?decoders=${decodersParam}: ${error.message}. Loading the default decoders.\n`;
      modelStatus.textContent = initError;
      modelStatus.classList.add('error');
      trustmarkInit();
    }

    // Show which backend each model runs on, and any model that failed to load
    trustmarkReady.then(({ models }) => {
      const lines = Object.entries(models).map(([name, m]) => {
        if (m.status !== 'ready') return `${name}: FAILED - ${m.error}`;
        return `${name}: ${m.backend}` + (m.fallbackFrom ? ` (${m.fallbackFrom} unavailable)` : '');
      });
      modelStatus.textContent = initError + 'Models: ' + (lines.join(', ') || 'none (no decoders requested)');
      modelStatus.classList.toggle('error', initError !== '' || Object.values(models).some((m) => m.status !== 'ready'));
    });

    // Logging function
    function LOG(message) {
      const timestamp = new Date().toLocaleTimeString();
      decoderOutput.textContent += `[${timestamp}] ${message}\n`;
      decoderOutput.scrollTop = decoderOutput.scrollHeight;
    }

    // -- DRAG & DROP FUNCTIONALITY --
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => e.preventDefault(), false);
      document.body.addEventListener(eventName, (e) => e.preventDefault(), false);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => {
        dropZone.classList.add('hover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => {
        dropZone.classList.remove('hover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length) {
        handleFile(files[0]);
      }
    });

    browseBtn.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) {
        handleFile(fileInput.files[0]);
      }
    });

    function scaleImage(base64Data, targetWidth, targetHeight) {
      const img = new Image();
      img.src = base64Data;

      return new Promise((resolve) => {
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const aspectRatio = img.width / img.height;

          if (img.width > img.height) {
            canvas.width = targetWidth;
            canvas.height = targetWidth / aspectRatio;
          } else {
            canvas.height = targetHeight;
            canvas.width = targetHeight * aspectRatio;
          }

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL());
        };
      });
    }

    async function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('Please select an image file!');
        return;
      }

      const reader = new FileReader();
      reader.onload = async function (e) {
        const base64Data = e.target.result;
        const scaledImage = await scaleImage(base64Data, 500, 300);
        previewImage.src = scaledImage;
        previewContainer.style.display = 'flex';
 
        decoderOutput.textContent='';//clear log
        decoderOutput.classList.remove('error');
        if (!trustmarkStatus().loaded) LOG("Waiting for models to load...");
        LOG("Decoding watermark...");

        // runwmark waits for the models to finish loading
        const data = await runwmark(scaledImage);
        decoderOutput.classList.toggle('error', data.status === 'error');
        LOG(describeResult(data));
      };

      reader.readAsDataURL(file);
    }

    function describeResult(data) {
      if (data.status === 'detected') {
        return `Watermark Found (${data.schema}, variant ${data.variant} on ${data.backend}):\n${data.watermark}\nC2PA Assertion:\n`+JSON.stringify(data.c2padata, null, 2);
      }
      if (data.status === 'error') {
        return `Error: could not check the image for a watermark.\n${data.error}`;
      }
      return "No watermark detected.";
    }

    // -- WATERMARK EMBEDDING --
    const encodeFile = document.getElementById('encode-file');
    const encodePayload = document.getElementById('encode-payload');
    const encodeBtn = document.getElementById('encode-btn');
    const encodeOutput = document.getElementById('encode-output');
    const encodeDownload = document.getElementById('encode-download');
    const encodePreview = document.getElementById('encode-preview');
    const encodeVariant = document.getElementById('encode-variant');
    const encodeSchema = document.getElementById('encode-schema');
    const encodePayloadLabel = document.getElementById('encode-payload-label');

    // Start with a random payload that fills the schema
    function randomPayload() {
      const bits = DataLayer_GetSchemaDataBits(DataLayer_GetSchemaVersion(encodeSchema.value));
      encodePayload.maxLength = bits;
      encodePayloadLabel.textContent = `Payload (up to ${bits} bits, shorter payloads are padded with zeros)`;
      encodePayload.value = Array.from(crypto.getRandomValues(new Uint8Array(bits)), (b) => b & 1).join('');
    }
    encodeSchema.addEventListener('change', randomPayload);
    randomPayload();

    encodeBtn.addEventListener('click', async () => {
      const file = encodeFile.files[0];
      encodeOutput.classList.remove('error');
      if (!file) {
        encodeOutput.textContent = 'Choose an image first.';
        return;
      }
      encodeBtn.disabled = true;
      encodeDownload.style.display = 'none';
      encodePreview.style.display = 'none';
      encodeOutput.textContent = 'Embedding watermark (the encoder model is downloaded on first use)...';
      try {
        const result = await trustmarkEncode(file, encodePayload.value.trim(), { variant: encodeVariant.value, schema: encodeSchema.value });
        const png = await imageToPngBlob(result.image);
        if (encodeDownload.href) URL.revokeObjectURL(encodeDownload.href);
        encodeDownload.href = URL.createObjectURL(png);
        encodeDownload.download = file.name.replace(/\.[^.]*$/, '') + `_${result.variant}.png`;
        encodeDownload.style.display = '';
        encodePreview.src = encodeDownload.href;
        encodePreview.style.display = '';
        encodeOutput.textContent = `Embedded ${result.schema} payload ${result.payload} (variant ${result.variant} on ${result.backend}).`;
        if (!trustmarkStatus().models[TrustmarkCore.getVariant(result.variant).decoder]) {
          encodeOutput.textContent += `\nThe ${result.variant} decoder is not loaded; open this page with ?decoders=${result.variant} to read the watermark back.`;
        }
      } catch (error) {
        console.error('Error embedding watermark:', error);
        encodeOutput.classList.add('error');
        encodeOutput.textContent = `Error: ${error.message}`;
      } finally {
        encodeBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
